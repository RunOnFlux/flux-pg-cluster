services:
  mock-api:
    image: flux-pg-cluster-mock-api:test
    build:
      context: ./mock-api
    environment:
      INITIAL_NODES_FILE: /data/myapp-postgres.json
    volumes:
      - ./mock-api/apps/location:/data:ro

  postgres-node1:
    environment:
      UPDATE_INTERVAL_SECONDS: "15"
      DESIRED_STATE_STABILITY_CYCLES: "2"
      PATRONI_TTL: "15"
      PATRONI_LOOP_WAIT: "5"
      PATRONI_RETRY_TIMEOUT: "10"
      PATRONI_MASTER_START_TIMEOUT: "60"
      FNF_COOLDOWN_SECS: "120"
      # Keep discovery tests fast; production retains the longer default.
      ETCD_JOIN_MAX_RETRIES: "3"
      # System-ID self-heal wipe is opt-in in production (default off).
      ALLOW_PG_DATA_WIPE: "true"
      PG_WIPE_COOLDOWN_SECS: "60"

  postgres-node2:
    environment:
      UPDATE_INTERVAL_SECONDS: "15"
      DESIRED_STATE_STABILITY_CYCLES: "2"
      PATRONI_TTL: "15"
      PATRONI_LOOP_WAIT: "5"
      PATRONI_RETRY_TIMEOUT: "10"
      PATRONI_MASTER_START_TIMEOUT: "60"
      FNF_COOLDOWN_SECS: "120"
      ETCD_JOIN_MAX_RETRIES: "3"
      ALLOW_PG_DATA_WIPE: "true"
      PG_WIPE_COOLDOWN_SECS: "60"

  postgres-node3:
    environment:
      UPDATE_INTERVAL_SECONDS: "15"
      DESIRED_STATE_STABILITY_CYCLES: "2"
      PATRONI_TTL: "15"
      PATRONI_LOOP_WAIT: "5"
      PATRONI_RETRY_TIMEOUT: "10"
      PATRONI_MASTER_START_TIMEOUT: "60"
      FNF_COOLDOWN_SECS: "120"
      ETCD_JOIN_MAX_RETRIES: "3"
      ALLOW_PG_DATA_WIPE: "true"
      PG_WIPE_COOLDOWN_SECS: "60"
