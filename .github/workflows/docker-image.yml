name: Docker Image CI

on:
  push:
    branches: [ "master", "development" ]
  pull_request:
    types: [closed]
    branches: [ "master", "development" ]

jobs:

  push_to_registry:
    name: Push Docker image (${{ matrix.postgres_major }})
    if: github.event.pull_request.merged == true || github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres_major: "14"
            tag_suffix: ""
          - postgres_major: "15"
            tag_suffix: "-pg15"
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7.0.1

      - name: Read image version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine Docker tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "base=latest" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/development" ]]; then
            echo "base=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          pull: true
          no-cache: true
          push: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            POSTGRES_MAJOR=${{ matrix.postgres_major }}
            VERSION=${{ steps.version.outputs.version }}
          tags: runonflux/flux-pg-cluster:${{ steps.tag.outputs.base }}${{ matrix.tag_suffix }}
